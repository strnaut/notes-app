version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: notes_postgres
    environment:
      - POSTGRES_USER: admin
      - POSTGRES_PASSWORD: password123
      - POSTGRES_DB: notes_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: